<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JJ</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #000;

    font-family: Arial, sans-serif;

    overflow: hidden;

    color: white;
}

        /* =========================
           ESCENARIO
        ========================= */

        .escenario {

            width: 100%;

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap: 18px;

            padding: 20px;
        }


        /* =========================
           TITULO
        ========================= */

        h1 {

            margin: 0;

            font-size: 32px;

            text-align: center;

            letter-spacing: 3px;

            text-shadow:
                0 0 10px #00aaff,
                0 0 25px #0066ff;
        }


        .instruccion {

            font-size: 16px;

            color: #bdeaff;

            text-align: center;

            margin-bottom: 5px;
        }


        /* =========================
           RETRATO
        ========================= */

   .retrato {
    position: relative;

    width: min(360px, 90vw);
    aspect-ratio: 3 / 4;

    overflow: hidden;

    background: #000;

    border: none;
    border-radius: 20px;

    perspective: 1000px;
    transform-style: preserve-3d;

    box-shadow:
        0 25px 60px rgba(0,0,0,.9),
        0 0 35px rgba(0,140,255,.35);

    transform:
        perspective(1000px)
        rotateX(3deg)
        rotateY(-5deg)
        translateZ(20px);

    transition: transform .15s ease-out;
}

        .retrato:hover {

            transform:

                perspective(900px)
                rotateX(0deg)
                rotateY(0deg)
                scale(1.02);

            box-shadow:

                0 0 20px #00c8ff,
                0 0 55px rgba(0, 170, 255, .8);
        }


     .retrato img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;

    transform: translateZ(18px) scale(1.02);

    filter:
        contrast(1.08)
        saturate(1.08)
        brightness(1.04);

    transition:
        transform .4s ease,
        filter .4s ease;
}


        /* =========================
           BRILLO 3D
        ========================= */

        .retrato::after {

            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:

                linear-gradient(
                    120deg,
                    rgba(255,255,255,.22),
                    transparent 30%,
                    transparent 70%,
                    rgba(0,140,255,.15)
                );

            mix-blend-mode: screen;
        }


        /* =========================
           ZONA CLICKEABLE DE LA CARA
        ========================= */

        .cara-click {

            position: absolute;

            left: 25%;

            top: 15%;

            width: 50%;

            height: 27%;

            border-radius: 50%;

            cursor: pointer;

            z-index: 5;

            transition:
                transform .15s ease,
                box-shadow .15s ease;
        }


        .cara-click:hover {

           


        .cara-click:active {

            transform: scale(.94);
        }


        /* =========================
           MENSAJE
        ========================= */

        .mensaje {

            padding: 10px 18px;

            border-radius: 20px;

            background: rgba(0, 30, 60, .75);

            border: 1px solid #28baff;

            color: white;

            font-size: 15px;

            box-shadow:
                0 0 12px rgba(0,170,255,.5);

            transition:
                transform .2s ease,
                opacity .2s ease;
        }


        .mensaje.activo {

            transform: scale(1.08);

            background: #075b91;

            box-shadow:
                0 0 20px #00bfff;
        }


    </style>

</head>


<body>


    <div class="escenario">


        <h1>
            JJ
        </h1>


        <div class="instruccion">
            Toca su cara 👇
        </div>


        <div class="retrato">


            <img
               src="nb/primo.jpg"
                alt="Retrato de mi primo"
            >


            <div
                class="cara-click"
                id="caraClick"
            ></div>


        </div>


        <div
            class="mensaje"
            id="mensaje"
        >
            🔊 Toca la cara para escuchar
        </div>


    </div>


    <!-- AUDIO -->

<audio id="audio1" src="nb/audio1.m4a"></audio>
<audio id="audio2" src="nb/audio2.m4a"></audio>
<audio id="audio3" src="nb/audio3.m4a"></audio>
<audio id="audio4" src="nb/audio4.m4a"></audio>
<audio id="audio5" src="nb/audio5.m4a"></audio>

  

    <script>


       const cara = document.getElementById("caraClick");
const mensaje = document.getElementById("mensaje");

const audios = [
    document.getElementById("audio1"),
    document.getElementById("audio2"),
    document.getElementById("audio3"),
    document.getElementById("audio4"),
    document.getElementById("audio5")
];

let audioActual = 0;

cara.addEventListener("click", function () {

    // Detener todos los audios
    audios.forEach(function(audio) {
        audio.pause();
        audio.currentTime = 0;
    });

    // Reproducir el siguiente audio
    const audio = audios[audioActual];

    audio.play();

    mensaje.textContent =
        "🔊 ¡Está hablando! (" + (audioActual + 1) + "/5)";

    mensaje.classList.add("activo");

    // Pasar al siguiente
    audioActual++;

    if (audioActual >= audios.length) {
        audioActual = 0;
    }

    setTimeout(function() {
        mensaje.textContent =
            "🔊 Toca la cara para escuchar";
        mensaje.classList.remove("activo");
    }, 1800);
});

     

window.addEventListener("deviceorientation", function(event) {

    const retrato = document.querySelector(".retrato");

    if (!retrato) return;

    const gamma = event.gamma || 0;
    const beta = event.beta || 0;

    // Movimiento izquierda / derecha
    const movimientoX =
        Math.max(-850, Math.min(850, gamma));

    // Movimiento arriba / abajo
    const movimientoY =
        Math.max(-75, Math.min(75, beta - 45));

    retrato.style.transform =
        `perspective(700px)
         rotateX(${-movimientoY}deg)
         rotateY(${movimientoX}deg)
         translateZ(35px)
         scale(1.04)`;
});

    </script>


</body>

</html>
